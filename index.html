<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet">
    <title>Tela Cadastro</title>
</head>

<body>
    <main>
        <div class="container">
            <h1 id="cadastro">Cadastro de Aluno</h1>
            <p>Preencha os dados abaixo para realizar o registro completo do aluno no sistema acadêmico:</p>
            <form class="row g-3">
                    <div class="form-group col-md-6">
                        <label for="name">Nome completo</label>
                        <input type="text" class="form-control" id="name" placeholder="Nome completo">
                    </div>

                    <div class="col-md-6">
                        <label for="cpf">CPF</label>
                        <input type="text" class="form-control" id="cpf" placeholder="CPF">
                    </div>

                <div class="form-group">
                    <label for="dataNascimento">Data de nascimento</label>
                    <input type="date" class="form-control" id="dataNascimento">
                </div>
                

                <div class="form-group">
                    <label for="telefone">Telefone</label>
                    <input type="text" class="form-control" id="telefone" placeholder="Telefone">
                </div>
               

                <div class="col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email">
                </div>

                <div class="col-12">
                    <label for="Endereco" class="form-label">Endereço</label>
                    <input type="text" class="form-control" id="Endereco" placeholder="n°, bairro, rua, complemento">
                </div>

                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="Cidade">Cidade</label>
                        <input type="text" class="form-control" id="Cidade">
                    </div>

                    <div class="form-group col-md-4">
                        <label for="Estado">Estado</label>
                        <select id="Estado" class="form-control">
                            <option value="">Selecione seu estado</option>
                            <option value="AC">AC</option>
                            <option value="AL">AL</option>
                            <option value="AM">AM</option>
                            <option value="AP">AP</option>
                            <option value="BA">BA</option>
                            <option value="CE">CE</option>
                            <option value="DF">DF</option>
                            <option value="GO">GO</option>
                            <option value="MA">MA</option>
                            <option value="MG">MG</option>
                            <option value="MS">MS</option>
                            <option value="MT">MT</option>
                            <option value="PA">PA</option>
                            <option value="PB">PB</option>
                            <option value="PE">PE</option>
                            <option value="PI">PI</option>
                            <option value="PR">PR</option>
                            <option value="RJ">RJ</option>
                            <option value="RN">RN</option>
                            <option value="RO">RO</option>
                            <option value="RR">RR</option>
                            <option value="RS">RS</option>
                            <option value="SC">SC</option>
                            <option value="SE">SE</option>
                            <option value="SP">SP</option>
                            <option value="TO">TO</option>
                        </select>
                    </div>

                    <div class="form-group col-md-2">
                        <label for="CEP">CEP</label>
                        <input type="text" class="form-control" id="CEP">
                    </div>
                    <p> </p>

                </div>

                <div class="form-group col-md-6">
                    <label for="Curso">Curso</label>
                    <input type="text" class="form-control" id="Curso">
                </div>
                <p> </p>

                <div class="form-group col-md-6">
                    <label for="Matrícula">Matrícula</label>
                    <input type="number" class="form-control" id="Matrícula">
                </div>
                <p> </p>

                <div class="col-md-6">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha">
                </div>
                <p> </p>

                <div class="col-md-6">
                    <label for="confirmar" class="form-label">Confirmar Senha</label>
                    <input type="password" class="form-control" id="confirmar">
                </div>
                <p> </p>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary">Cadastrar</button>
                </div>

            </form>

        </div>
    </main>
</body>

</html>
