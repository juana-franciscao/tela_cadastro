<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet">
    <title>Tela Cadastro</title>
</head>

<body>
    <main>
        <div class="container">
            <h1 id="cadastro">Cadastro de Aluno</h1>
            <p>Preencha os dados abaixo para realizar o registro completo do aluno no sistema acadêmico:</p>
            <form class="row g-3">
                <div class="col-md-6">
                    <label for="Nome" class="form-label">Nome Completo</label>
                    <input type="text" class="form-control" id="Nome">
                </div>
                <div class="col-md-6">
                    <label for="CPF" class="form-label">CPF</label>
                    <input type="text" class="form-control" id="CPF" placeholder="XXX.XXX.XXX-XX">
                </div>
                <div class="col-md-4">
                    <label for="Nascimento" class="form-label">Data de Nascimento</label>
                    <input type="date" class="form-control" id="Nascimento" placeholder="DD/MM/AAAA">
                </div>
                <div class="col-md-4">
                    <label for="Telefone" class="form-label">Telefone</label>
                    <input type="tel" class="form-control" id="Telefone" placeholder="(XX) XXXXX-XXXX">
                </div>
                <div class="col-md-4">
                    <label for="Email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="Email" placeholder="email@example.com">
                </div>
                <div class="col-md-12">
                    <label for="Endereco" class="form-label">Endereço</label>
                    <input type="text" class="form-control" id="Endereco">
                </div>
                <div class="col-md-4">
                    <label for="Cidade" class="form-label">Cidade</label>
                    <input type="text" class="form-control" id="Cidade">
                </div>
                <div class="col-md-4">
                    <label for="Estado" class="form-label">Estado</label>
                    <select id="Estado" class="form-select">
                        <option selected="">Selecione Seu Estado</option>
                        <option>AC</option>
                        <option>AL</option>
                        <option>AM</option>
                        <option>AP</option>
                        <option>BA</option>
                        <option>CE</option>
                        <option>DF</option>
                        <option>ES</option>
                        <option>GO</option>
                        <option>MA</option>
                        <option>MG</option>
                        <option>MS</option>
                        <option>MT</option>
                        <option>PA</option>
                        <option>PB</option>
                        <option>PE</option>
                        <option>PI</option>
                        <option>PR</option>
                        <option>RJ</option>
                        <option>RN</option>
                        <option>RO</option>
                        <option>RR</option>
                        <option>RS</option>
                        <option>SC</option>
                        <option>SE</option>
                        <option>SP</option>
                        <option>TO</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label for="CEP" class="form-label">CEP</label>
                    <input type="text" class="form-control" id="CEP" placeholder="XXXXX-XXX">
                </div>
                <div class="col-md-6">
                    <label for="Curso" class="form-label">Curso</label>
                    <input type="text" class="form-control" id="Curso" placeholder="Nome do Curso">
                </div>
                <div class="col-md-6">
                    <label for="Matricula" class="form-label">Matrícula</label>
                    <input type="number" class="form-control" id="Matricula">
                </div>
                <div class="col-md-6">
                    <label for="Senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="Senha" placeholder="Digite sua Senha">
                </div>
                <div class="col-md-6">
                    <label for="ConfirmarSenha" class="form-label">Confirmar Senha</label>
                    <input type="password" class="form-control" id="ConfirmarSenha" placeholder="Confirme sua Senha">
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Cadastrar</button>
                </div>

            </form>
    </main>
</body>

</html>
